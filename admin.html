<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin | THE SOCIAL PHNOM PENH</title>
    <link href="static/thesocial_logo.ico" rel="icon" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fdf8f8;
        --card: #ffffff;
        --ink: #1c1b1b;
        --muted: #5c5f60;
        --line: #e5e2e1;
        --soft: #f1edec;
        --accent: #00a3ff;
        --accent-deep: #2e5bff;
        --danger: #ba1a1a;
        --ok: #1f7a4d;
        --warn: #b26a00;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: "Outfit", system-ui, sans-serif;
        font-weight: 400;
        color: var(--ink);
        background: var(--bg);
        font-size: 15px;
        line-height: 1.5;
      }
      button, input, select, textarea { font: inherit; color: inherit; }
      h1, h2, h3 { font-weight: 500; letter-spacing: -0.01em; margin: 0; }

      /* ---------- full-screen states ---------- */
      .center {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .panel {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.05);
      }
      .brand {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .panel h1 { font-size: 28px; margin: 18px 0 8px; }
      .panel p { color: var(--muted); margin: 0 0 24px; font-weight: 300; }
      .msg-error { color: var(--danger); font-size: 13px; margin-top: 14px; min-height: 18px; }

      /* ---------- buttons ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: #fff;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        transition: opacity 0.15s, transform 0.15s;
      }
      .btn:hover { opacity: 0.88; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn.light { background: #fff; color: var(--ink); border-color: var(--line); }
      .btn.light:hover { border-color: var(--ink); opacity: 1; }
      .btn.danger { background: #fff; color: var(--danger); border-color: #f0c4c0; }
      .btn.small { padding: 6px 12px; font-size: 13px; }
      .btn.block { width: 100%; }
      .btn-ghost {
        background: none; border: 0; cursor: pointer; color: var(--muted);
        padding: 4px 8px; border-radius: 6px; font-size: 18px; line-height: 1;
      }
      .btn-ghost:hover { background: var(--soft); color: var(--ink); }
      .link { background: none; border: 0; padding: 0; color: var(--accent-deep); cursor: pointer; text-decoration: underline; font-size: inherit; }

      /* ---------- app shell ---------- */
      #app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
      #sidebar {
        background: var(--card);
        border-right: 1px solid var(--line);
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      #sidebar .brand { padding: 4px 12px 24px; }
      #nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
      #nav a {
        display: block;
        padding: 10px 12px;
        border-radius: 8px;
        color: var(--muted);
        text-decoration: none;
        font-weight: 400;
      }
      #nav a:hover { background: var(--soft); color: var(--ink); }
      #nav a.active { background: var(--ink); color: #fff; }
      .me { border-top: 1px solid var(--line); padding: 16px 12px 0; font-size: 13px; }
      .me .who { word-break: break-all; font-weight: 500; }
      .me .role { color: var(--muted); text-transform: capitalize; margin-bottom: 10px; }
      .main { min-width: 0; }
      .topbar {
        display: flex; align-items: center; gap: 12px;
        padding: 20px 32px; border-bottom: 1px solid var(--line);
        background: rgba(253, 248, 248, 0.92); backdrop-filter: blur(8px);
        position: sticky; top: 0; z-index: 5;
      }
      .topbar h1 { font-size: 22px; flex: 1; }
      #menu-btn { display: none; }
      #view { padding: 28px 32px 80px; max-width: 1280px; }

      /* ---------- cards / stats ---------- */
      .grid { display: grid; gap: 16px; }
      .stats { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 28px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
      .stat .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
      .stat .value { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; margin-top: 6px; }
      .stat .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
      .two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
      .card h2 { font-size: 16px; margin-bottom: 12px; }
      .list-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
      .list-row:first-of-type { border-top: 0; }
      .list-row .sub { color: var(--muted); font-size: 13px; }
      .empty { color: var(--muted); padding: 28px 8px; text-align: center; }

      /* ---------- toolbar / tables ---------- */
      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
      .toolbar .grow { flex: 1; }
      .input, .select, .textarea {
        width: 100%; border: 1px solid var(--line); background: #fff;
        border-radius: 8px; padding: 9px 12px; outline: none;
      }
      .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 163, 255, 0.15); }
      .toolbar .input { max-width: 280px; }
      .toolbar .select { width: auto; }
      .textarea { min-height: 84px; resize: vertical; }
      .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; min-width: 720px; }
      th { text-align: left; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #faf7f6; white-space: nowrap; }
      td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
      tr:last-child td { border-bottom: 0; }
      tbody tr.click { cursor: pointer; }
      tbody tr.click:hover { background: #faf7f6; }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      td .sub { color: var(--muted); font-size: 13px; }
      .actions { display: flex; gap: 6px; justify-content: flex-end; }
      .overdue { color: var(--danger); font-weight: 500; }

      /* pipeline strip */
      .strip { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 2px; }
      .chip {
        flex: 1; min-width: 118px; text-align: left; cursor: pointer;
        background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      }
      .chip:hover, .chip.on { border-color: var(--ink); }
      .chip .n { font-size: 20px; font-weight: 500; }
      .chip .t { font-size: 12px; color: var(--muted); }

      /* badges */
      .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--soft); color: var(--ink); white-space: nowrap; }
      .s-lead { background: #eef1f5; color: #3b4a5f; }
      .s-contacted { background: #e3f3ff; color: #0b5a8f; }
      .s-proposal { background: #e8ecff; color: #2438a8; }
      .s-negotiation { background: #fff1db; color: #8a5300; }
      .s-won, .s-paid { background: #dff3e8; color: var(--ok); }
      .s-lost { background: #fde6e4; color: var(--danger); }
      .s-on_hold, .s-draft { background: #efecec; color: #5c5f60; }
      .s-sent { background: #e3f3ff; color: #0b5a8f; }
      .s-overdue { background: #fde6e4; color: var(--danger); }

      /* ---------- modal ---------- */
      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(20, 20, 20, 0.45);
        display: flex; align-items: flex-start; justify-content: center;
        padding: 5vh 16px; overflow-y: auto; z-index: 50;
      }
      .modal { background: var(--card); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25); }
      .modal.wide { max-width: 820px; }
      .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--line); }
      .modal-head h2 { font-size: 19px; }
      .modal-body { padding: 24px; }
      .modal-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid var(--line); background: #faf7f6; border-radius: 0 0 14px 14px; }
      .modal-foot .spacer { flex: 1; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .form-grid .full { grid-column: 1 / -1; }
      label.f { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
      .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .checks { display: flex; flex-wrap: wrap; gap: 12px; }
      .checks label { display: flex; align-items: center; gap: 8px; font-size: 14px; }

      /* timeline */
      .timeline { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 20px; }
      .timeline h3 { font-size: 15px; margin-bottom: 12px; }
      .act { border-left: 2px solid var(--line); padding: 2px 0 14px 14px; margin-left: 4px; }
      .act .meta { font-size: 12px; color: var(--muted); }
      .act .kind { text-transform: capitalize; font-weight: 500; }
      .act-form { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; margin-bottom: 18px; }

      /* line items */
      .item-head, .item-row { display: grid; grid-template-columns: 1fr 80px 110px 100px 32px; gap: 8px; align-items: center; }
      .item-head { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
      .item-row { margin-bottom: 8px; }
      .i-amt { text-align: right; font-variant-numeric: tabular-nums; }
      .totals { margin: 16px 0 0 auto; max-width: 280px; font-size: 14px; }
      .totals div { display: flex; justify-content: space-between; padding: 3px 0; }
      .totals .grand { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-weight: 600; font-size: 16px; }

      /* printable sheet */
      .sheet { padding: 8px 4px; font-size: 14px; }
      .sheet .sh-top { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
      .sheet .doc-title { font-size: 30px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; text-align: right; }
      .sheet .doc-meta { text-align: right; color: var(--muted); font-size: 13px; }
      .sheet table { min-width: 0; margin-top: 18px; }
      .sheet th { background: none; border-bottom: 2px solid var(--ink); color: var(--ink); }
      .sheet .tag { display: inline-block; margin-top: 6px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--ink); padding: 2px 8px; border-radius: 4px; }
      .sheet .foot { margin-top: 28px; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
      .sheet .foot strong { color: var(--ink); }

      /* toasts */
      #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
      .toast { background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 14px; max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
      .toast.err { background: var(--danger); }

      /* ---------- mobile ---------- */
      @media (max-width: 860px) {
        #app { grid-template-columns: 1fr; }
        #sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 264px; z-index: 40; transform: translateX(-100%); transition: transform 0.25s; }
        #sidebar.open { transform: none; box-shadow: 0 0 80px rgba(0,0,0,0.3); }
        #menu-btn { display: inline-flex; }
        .topbar { padding: 14px 16px; }
        #view { padding: 20px 16px 80px; }
        .form-grid { grid-template-columns: 1fr; }
        .act-form { grid-template-columns: 1fr; }
        .item-head { display: none; }
        .item-row { grid-template-columns: 1fr 64px 90px 32px; }
        .item-row .i-amt { display: none; }
      }

      /* ---------- print ---------- */
      @media print {
        body { background: #fff; }
        body * { visibility: hidden; }
        #print-sheet, #print-sheet * { visibility: visible; }
        #print-sheet { position: absolute; left: 0; top: 0; width: 100%; }
        .modal-backdrop { position: absolute; background: none; padding: 0; overflow: visible; }
        .modal { box-shadow: none; max-width: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" class="center"><span class="brand">Loading</span></div>

    <section id="login" class="center" hidden>
      <div class="panel">
        <div class="brand">The Social Phnom Penh</div>
        <h1>Team admin</h1>
        <p>Sign in with the Google account your admin added for you.</p>
        <button id="google-btn" class="btn block" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Continue with Google
        </button>
        <div id="login-error" class="msg-error" role="alert"></div>
      </div>
    </section>

    <section id="denied" class="center" hidden>
      <div class="panel">
        <div class="brand">The Social Phnom Penh</div>
        <h1>No access yet</h1>
        <p>
          <strong id="denied-email"></strong> is not on the team list. Ask an admin to add this
          Google account, then sign in again.
        </p>
        <button id="denied-out" class="btn light block" type="button">Sign out</button>
        <div id="denied-error" class="msg-error"></div>
      </div>
    </section>

    <div id="app" hidden>
      <aside id="sidebar">
        <div class="brand">The Social<br />Admin</div>
        <nav id="nav" aria-label="Admin sections"></nav>
        <div class="me">
          <div class="who" id="me-email"></div>
          <div class="role" id="me-role"></div>
          <button id="signout" class="btn light small block" type="button">Sign out</button>
        </div>
      </aside>
      <div class="main">
        <header class="topbar">
          <button id="menu-btn" class="btn light small" type="button" aria-label="Open menu">Menu</button>
          <h1 id="view-title"></h1>
          <div id="top-actions"></div>
        </header>
        <main id="view"></main>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toasts" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
  </body>
</html>
