<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f3f2">
<title>Form | The Social Phnom Penh</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/aileron-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/fb-form.css">
<style>
  html, body { margin: 0; background: #f6f3f2; }
  @media (prefers-color-scheme: dark) { html.fb-auto, html.fb-auto body { background: #0d0d0d; } }
  html.fb-dark, html.fb-dark body { background: #0d0d0d; }
  .state { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; font-family: "Aileron", "Helvetica Neue", Arial, sans-serif; color: #141414; }
  .state h1 { font-family: "Agrandir", "Outfit", "Helvetica Neue", Arial, sans-serif; font-size: 28px; margin: 0 0 8px; }
  .state p { margin: 0 0 18px; color: #6b6767; line-height: 1.6; max-width: 380px; }
  .state a { color: inherit; font-weight: 600; }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #ddd; border-top-color: #141414; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"><div class="state"><div class="spin" role="status" aria-label="Loading"></div></div></div>
<noscript><div class="state"><div><h1>JavaScript needed</h1><p>This form needs JavaScript to run. Turn it on and reload the page.</p></div></div></noscript>
<script src="/fb-form.js"></script>
<script>
(function () {
  var URL_ = "https://vxamxpmhgkgxwecdycjj.supabase.co";
  var KEY = "sb_publishable_CRnwiQGclzMiH7AAlZi0tw_w4bkNp1T";
  var root = document.getElementById("root");
  var H = { apikey: KEY, Authorization: "Bearer " + KEY };

  var m = /^\/f\/([a-z0-9-]+)\/?$/.exec(location.pathname);
  var slug = m ? m[1] : (new URLSearchParams(location.search).get("s") || "").toLowerCase();

  function state(title, text, home) {
    root.textContent = "";
    var s = document.createElement("div"); s.className = "state";
    var box = document.createElement("div");
    var h = document.createElement("h1"); h.textContent = title;
    var p = document.createElement("p"); p.textContent = text;
    box.appendChild(h); box.appendChild(p);
    if (home) { var a = document.createElement("a"); a.href = "/"; a.textContent = "Back to The Social"; box.appendChild(a); }
    s.appendChild(box); root.appendChild(s);
  }

  if (!/^[a-z0-9][a-z0-9-]{1,58}$/.test(slug)) { state("Form not found", "Check the link and try again.", true); return; }

  fetch(URL_ + "/rest/v1/forms?select=id,slug,title,description,fields,status,theme,thank_you,closes_at,max_responses,payment&slug=eq." + encodeURIComponent(slug), { headers: H })
    .then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); })
    .then(function (rows) {
      var f = rows && rows[0];
      if (!f) { state("Form not found", "Check the link and try again.", true); return; }
      document.title = f.title + " | The Social Phnom Penh";
      var mode = (f.theme && f.theme.mode) || "light";
      document.documentElement.classList.add("fb-" + mode);
      var closed = f.status === "closed" || (f.closes_at && new Date(f.closes_at) < new Date());
      if (closed) { state(f.title, "This form is closed and is no longer taking responses.", true); return; }
      var qs = new URLSearchParams(location.search);
      var tranBack = (qs.get("paid") || "").toUpperCase();
      var pendingKey = "fb-pay:" + slug;
      function fn(body) {
        return fetch(URL_ + "/functions/v1/payway", { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, H), body: JSON.stringify(body) })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.error || "http"); return j; }); });
      }
      function openPayWay(pay) {
        try { localStorage.setItem(pendingKey, pay.tran_id); } catch (e) {}
        return fn({ action: "checkout", tran_id: pay.tran_id }).then(function (r) {
          if (r.status === "paid") { location.replace("/f/" + slug + "?paid=" + pay.tran_id); return; }
          var form = document.createElement("form");
          form.method = "POST"; form.action = r.action_url; form.enctype = "multipart/form-data"; form.style.display = "none";
          Object.keys(r.fields).forEach(function (k) {
            var i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = r.fields[k]; form.appendChild(i);
          });
          document.body.appendChild(form);
          form.submit();
        });
      }
      if (tranBack && /^[A-Z0-9]{6,20}$/.test(tranBack)) {
        var tries = 0;
        FB.status(root, f, { brand: true, tick: false, title: "Confirming your payment", text: "One moment while we check with ABA PayWay." });
        (function poll() {
          fn({ action: "verify", tran_id: tranBack }).then(function (r) {
            if (r.status === "paid") {
              try { localStorage.removeItem(pendingKey); } catch (e) {}
              FB.status(root, f, { brand: true, title: "Payment received", text: f.thank_you || "Thanks, you are all set." });
            } else if (r.status === "failed" || r.status === "mismatch") {
              FB.status(root, f, { brand: true, tick: false, title: "Payment not completed", text: "ABA PayWay did not confirm this payment. You can try again.", button: "Try payment again", onButton: function (b) { b.disabled = true; openPayWay({ tran_id: tranBack }).catch(function () { b.disabled = false; }); } });
            } else if (++tries < 8) setTimeout(poll, 2500);
            else FB.status(root, f, { brand: true, tick: false, title: "Still waiting for the bank", text: "We have your answers. If you paid, it can take a few minutes to show up. You can close this page.", button: "Check again", onButton: function () { location.reload(); } });
          }).catch(function () {
            if (++tries < 8) setTimeout(poll, 2500);
            else FB.status(root, f, { brand: true, tick: false, title: "Could not check the payment", text: "Refresh this page in a moment. Your answers are saved.", button: "Refresh", onButton: function () { location.reload(); } });
          });
        })();
        return;
      }
      if (qs.get("cancelled")) {
        var saved = ""; try { saved = localStorage.getItem(pendingKey) || ""; } catch (e) {}
        if (saved) {
          FB.status(root, f, { brand: true, tick: false, title: "Payment not completed", text: "Your answers are saved. Finish the payment whenever you are ready.", button: "Pay now", onButton: function (b) { b.disabled = true; openPayWay({ tran_id: saved }).catch(function () { b.disabled = false; }); } });
          return;
        }
      }
      FB.render(root, f, {
        brand: true,
        onPay: openPayWay,
        onSubmit: function (answers, hp) {
          return fetch(URL_ + "/rest/v1/rpc/submit_form", {
            method: "POST",
            headers: Object.assign({ "Content-Type": "application/json" }, H),
            body: JSON.stringify({ p_slug: slug, p_answers: answers, p_hp: hp || "" })
          }).then(function (r) {
            return r.json().then(function (b) {
              if (r.ok) return { ok: true, message: b && b.message, pay: b && b.pay };
              return { ok: false, error: (b && b.message) || "" };
            }, function () { return { ok: false, error: "" }; });
          });
        }
      });
    })
    .catch(function () { state("Could not load the form", "Check your connection and refresh the page.", false); });
})();
</script>
</body>
</html>
